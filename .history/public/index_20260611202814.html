<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZX Chat</title>
  
  <!-- ✅ BLOQUEIO GLOBAL DE MENSAGENS "Usuário" -->
  <script>
  // ============================================
  // BLOQUEIO GLOBAL - IMPEDE QUALQUER MENSAGEM "Usuário"
  // ============================================
  (function() {
    // Salvar o nome correto
    const nomeReal = localStorage.getItem('userNickname') || localStorage.getItem('currentUserNickname') || localStorage.getItem('username') || 'Deka';
    localStorage.setItem('userNickname', nomeReal);
    localStorage.setItem('username', nomeReal);
    
    // Interceptar e modificar qualquer mensagem antes de ser exibida
    const originalAppendChild = Node.prototype.appendChild;
    Node.prototype.appendChild = function(child) {
      if (child.classList && child.classList.contains('message')) {
        const html = child.innerHTML;
        if (html.includes('Usuário') && !html.includes(nomeReal)) {
          console.log('⚠ Mensagem com Usuário BLOQUEADA');
          return document.createComment('blocked');
        }
      }
      return originalAppendChild.call(this, child);
    };
    
    // Limpar mensagens existentes constantemente
    setInterval(() => {
      document.querySelectorAll('.message').forEach(msg => {
        if (msg.innerHTML.includes('Usuário') && !msg.innerHTML.includes(nomeReal)) {
          msg.remove();
        }
      });
    }, 50);
    
    // Forçar o botão de enviar a usar apenas o nome real
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('send-btn');
      const input = document.getElementById('message-input');
      
      if (btn && input) {
        const newBtn = btn.cloneNode(true);
        const newInput = input.cloneNode(true);
        btn.parentNode?.replaceChild(newBtn, btn);
        input.parentNode?.replaceChild(newInput, input);
        
        newBtn.onclick = () => {
          const texto = newInput.value.trim();
          if (texto && window.socket && window.socket.connected) {
            // ✅ Envia para o servidor e aguarda confirmação
            window.socket.emit('message', {
              channel: window.currentChannel || 'geral',
              text: texto,
              communityId: window.currentCommunityId
            });
            newInput.value = '';
          }
        };
        
        newInput.onkeypress = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            newBtn.onclick();
          }
        };
      }
    });
  })();
  </script>

    /* Picker Container Base */

    }

    .chat-picker.active {
      display: flex;
    }

    @keyframes pickerOpen {

      to { opacity: 1; transform: translateY(0); }

      gap: 8px;
    }

      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      aspect-ratio: 16/9;
      background: rgba(255,0,255,0.05);
    }

    .gif-item:hover {
