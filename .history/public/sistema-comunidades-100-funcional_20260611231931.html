<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Comunidades - 100% Funcional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0012;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
        }

        /* ================================================
           MODAL DE CRIAR COMUNIDADE - ESTRUTURA COMPLETA
           ================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-create-community {
            width: 100%;
            max-width: 650px;
            background: #12121a;
            border: 2px solid #ff00ff;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.4);
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-create-community {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 0, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #00ffff;
        }

        .modal-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 0, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            background: rgba(255, 0, 255, 0.3);
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .form-textarea {
            resize: none;
            min-height: 80px;
        }

        .modal-footer {
            padding: 16px 24px 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255, 0, 255, 0.3);
            color: #fff;
        }

        .btn-ghost:hover {
            background: rgba(255, 0, 255, 0.1);
        }

        .btn-neon {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #000;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 0, 255, 0.3);
        }

        /* ================================================
           SEÇÃO MINHAS COMUNIDADES
           ================================================ */
        .section-title {
            color: #00ffff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .communities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .community-card {
            min-height: 280px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 0, 255, 0.3);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .community-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 0, 255, 0.6);
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.2);
        }

        .community-card.create-card {
            border: 2px dashed rgba(0, 255, 255, 0.4);
            background: rgba(0, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .community-card.create-card .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .community-card.create-card .title {
            color: #00ffff;
            font-size: 16px;
            font-weight: 600;
        }

        .community-card.create-card .subtitle {
            color: #888;
            font-size: 13px;
        }

        .community-card .banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .community-card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 20px 16px 16px 16px;
        }

        .community-card .name {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .community-card .members {
            color: #aaa;
            font-size: 12px;
        }

        .community-card .actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .community-card:hover .actions {
            opacity: 1;
        }

        .community-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .community-action-btn:hover {
            background: rgba(255, 0, 255, 0.4);
        }

        /* ================================================
           MENU DE CONTEXTO
           ================================================ */
        .context-menu {
            position: fixed;
            background: #12121a;
            border: 1px solid #ff00ff;
            border-radius: 8px;
            padding: 8px;
            min-width: 200px;
            z-index: 999999;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.3);
        }

        .context-menu-item {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-menu-item:hover {
            background: rgba(255, 0, 255, 0.15);
        }

        .context-menu-divider {
            height: 1px;
            background: rgba(255, 0, 255, 0.2);
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏠 MINHAS COMUNIDADES</h1>

        <div class="section-title">
            <span>✨</span> COMUNIDADES SUGERIDAS
        </div>
        <div id="suggested-communities-container" class="communities-grid">
            <div class="community-card create-card" id="suggested-empty-state">
                <div class="icon">🌐</div>
                <div class="title">Nenhuma comunidade ainda</div>
                <div class="subtitle">Clique com o botão direito em uma comunidade</div>
            </div>
        </div>

        <div class="section-title">
            <span>🏠</span> MINHAS COMUNIDADES
        </div>
        <div id="my-communities-grid" class="communities-grid">
            <div class="community-card create-card" id="btn-create-community-card">
                <div class="icon">+</div>
                <div class="title">Criar Comunidade</div>
                <div class="subtitle">Crie sua própria comunidade</div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CRIAR COMUNIDADE -->
    <div id="create-community-modal" class="modal-overlay">
        <div class="modal-create-community">
            <div class="modal-header">
                <div class="modal-title">🌐 CRIAR COMUNIDADE</div>
                <button class="modal-close-btn" id="modal-close-btn">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nome da Comunidade</label>
                    <input type="text" id="community-name" class="form-input" placeholder="Digite o nome da comunidade..." maxlength="32" />
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <textarea id="community-description" class="form-input form-textarea" placeholder="Descreva sua comunidade..." maxlength="200"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="btn-cancel-community">Cancelar</button>
                <button class="btn btn-neon" id="btn-create-community-confirm">✅ Criar Comunidade</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // SISTEMA COMPLETO DE COMUNIDADES - 100% FUNCIONAL
        // ================================================

        // Estado global
        let comunidades = [];
        let comunidadesSugeridas = [];

        // Elementos DOM
        const modal = document.getElementById('create-community-modal');
        const btnAbrirModal = document.getElementById('btn-create-community-card');
        const btnFecharModal = document.getElementById('modal-close-btn');
        const btnCancelar = document.getElementById('btn-cancel-community');
        const btnCriar = document.getElementById('btn-create-community-confirm');
        const gridComunidades = document.getElementById('my-communities-grid');
        const gridSugeridas = document.getElementById('suggested-communities-container');

        // ================================================
        // FUNÇÕES DO MODAL
        // ================================================

        function abrirModal() {
            modal.classList.add('active');
            document.getElementById('community-name').focus();
            console.log('✅ Modal aberto com sucesso!');
        }

        function fecharModal() {
            modal.classList.remove('active');
            // Limpa os campos
            document.getElementById('community-name').value = '';
            document.getElementById('community-description').value = '';
        }

        // Eventos do modal
        btnAbrirModal.addEventListener('click', abrirModal);
        btnFecharModal.addEventListener('click', fecharModal);
        btnCancelar.addEventListener('click', fecharModal);

        // Fecha modal ao clicar fora
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                fecharModal();
            }
        });

        // Fecha modal com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                fecharModal();
            }
        });

        // ================================================
        // CRIAR NOVA COMUNIDADE
        // ================================================

        btnCriar.addEventListener('click', () => {
            const nome = document.getElementById('community-name').value.trim();
            const descricao = document.getElementById('community-description').value.trim();

            if (!nome) {
                alert('Digite um nome para a comunidade');
                return;
            }

            // Cria o objeto da comunidade
            const novaComunidade = {
                id: 'comm_' + Date.now(),
                name: nome,
                description: descricao,
                members: 1,
                createdAt: Date.now()
            };

            // Adiciona no array
            comunidades.push(novaComunidade);

            // Salva no localStorage
            salvarComunidades();

            // Fecha o modal
            fecharModal();

            // Renderiza a nova comunidade na página
            renderizarComunidades();

            alert(`✅ Comunidade "${nome}" criada com sucesso!`);
        });

        // ================================================
        // RENDERIZAR COMUNIDADES NA PÁGINA
        // ================================================

        function renderizarComunidades() {
            // Remove todos os cards existentes (exceto o botão de criar)
            gridComunidades.querySelectorAll('.community-card:not(.create-card)').forEach(card => card.remove());

            // Renderiza cada comunidade
            comunidades.forEach(comunidade => {
                const card = document.createElement('div');
                card.className = 'community-card';
                card.dataset.communityId = comunidade.id;

                card.innerHTML = `
                    <div style="width: 100%; height: 100%; background: linear-gradient(180deg, rgba(128, 0, 255, 0.2), rgba(0, 0, 0, 0.8)); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; padding: 20px 16px 16px 16px;">
                        <div style="font-size: 48px; opacity: 0.7;">🌐</div>
                        <div class="name">${comunidade.name}</div>
                        <div class="members">${comunidade.members} membros</div>
                    </div>
                    <div class="actions">
                        <button class="community-action-btn" title="Colocar nas Sugeridas">✨</button>
                        <button class="community-action-btn" title="Editar">✏</button>
                        <button class="community-action-btn" title="Apagar">🗑</button>
                    </div>
                `;

                // Botão colocar nas sugeridas
                card.querySelector('.community-action-btn:nth-child(1)').addEventListener('click', (e) => {
                    e.stopPropagation();
                    adicionarNasSugeridas(comunidade);
                });

                // Menu de contexto com botão direito
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    abrirMenuContexto(e.clientX, e.clientY, comunidade);
                });

                // Insere o card antes do botão de criar
                gridComunidades.insertBefore(card, btnAbrirModal);
            });
        }

        // ================================================
        // ADICIONAR NAS SUGERIDAS
        // ================================================

        function adicionarNasSugeridas(comunidade) {
            // Verifica se já existe
            const jaExiste = comunidadesSugeridas.some(c => c.id === comunidade.id);
            
            if (jaExiste) {
                alert('⚠ Essa comunidade já está nas Sugeridas!');
                return;
            }

            // Adiciona na lista
            comunidadesSugeridas.push(comunidade);

            // Salva no localStorage
            salvarSugeridas();

            // Renderiza na seção de sugeridas
            renderizarSugeridas();

            alert(`✅ Comunidade "${comunidade.name}" adicionada nas Sugeridas!`);
        }

        function renderizarSugeridas() {
            // Remove todos os cards existentes (exceto o card vazio)
            gridSugeridas.querySelectorAll('.community-card:not(.create-card)').forEach(card => card.remove());

            // Se tiver comunidades, remove o card vazio
            if (comunidadesSugeridas.length > 0) {
                const cardVazio = document.getElementById('suggested-empty-state');
                if (cardVazio) cardVazio.remove();
            }

            // Renderiza cada comunidade sugerida
            comunidadesSugeridas.forEach(comunidade => {
                const card = document.createElement('div');
                card.className = 'community-card';
                card.dataset.suggestedId = comunidade.id;

                card.innerHTML = `
                    <div style="width: 100%; height: 100%; background: linear-gradient(180deg, rgba(128, 0, 255, 0.2), rgba(0, 0, 0, 0.8)); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; padding: 20px 16px 16px 16px;">
                        <div style="font-size: 48px; opacity: 0.7;">🌐</div>
                        <div class="name">${comunidade.name}</div>
                        <div class="members">${comunidade.members} membros</div>
                    </div>
                `;

                gridSugeridas.appendChild(card);
            });
        }

        // ================================================
        // MENU DE CONTEXTO
        // ================================================

        function abrirMenuContexto(x, y, comunidade) {
            // Fecha qualquer menu aberto
            document.querySelectorAll('.context-menu').forEach(m => m.remove());

            const menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';

            menu.innerHTML = `
                <button class="context-menu-item" data-action="suggest">
                    <span>✨</span> Colocar nas Sugeridas
                </button>
                <button class="context-menu-item" data-action="edit">
                    <span>✏</span> Editar Comunidade
                </button>
                <div class="context-menu-divider"></div>
                <button class="context-menu-item" data-action="delete" style="color: #ff4444;">
                    <span>🗑</span> Apagar Comunidade
                </button>
            `;

            document.body.appendChild(menu);

            // Ações dos botões
            menu.querySelectorAll('.context-menu-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.action;
                    menu.remove();

                    switch(action) {
                        case 'suggest':
                            adicionarNasSugeridas(comunidade);
                            break;
                        case 'edit':
                            alert(`✅ Abrindo edição da comunidade: ${comunidade.name}`);
                            break;
                        case 'delete':
                            if (confirm(`Tem certeza que deseja APAGAR a comunidade "${comunidade.name}"?`)) {
                                comunidades = comunidades.filter(c => c.id !== comunidade.id);
                                comunidadesSugeridas = comunidadesSugeridas.filter(c => c.id !== comunidade.id);
                                salvarComunidades();
                                salvarSugeridas();
                                renderizarComunidades();
                                renderizarSugeridas();
                                alert(`✅ Comunidade apagada com sucesso!`);
                            }
                            break;
                    }
                });
            });

            // Fecha menu ao clicar fora
            setTimeout(() => {
                document.addEventListener('click', function fecharMenu(e) {
                    if (!menu.contains(e.target)) {
                        menu.remove();
                        document.removeEventListener('click', fecharMenu);
                    }
                });
            }, 10);
        }

        // ================================================
        // SALVAR E CARREGAR DO LOCALSTORAGE
        // ================================================

        function salvarComunidades() {
            localStorage.setItem('minhasComunidades', JSON.stringify(comunidades));
        }

        function carregarComunidades() {
            try {
                const salvas = localStorage.getItem('minhasComunidades');
                if (salvas) {
                    comunidades = JSON.parse(salvas);
                }
            } catch (e) {
                comunidades = [];
            }
        }

        function salvarSugeridas() {
            localStorage.setItem('comunidadesSugeridas', JSON.stringify(comunidadesSugeridas));
        }

        function carregarSugeridas() {
            try {
                const salvas = localStorage.getItem('comunidadesSugeridas');
                if (salvas) {
                    comunidadesSugeridas = JSON.parse(salvas);
                }
            } catch (e) {
                comunidadesSugeridas = [];
            }
        }

        // ================================================
        // INICIALIZAÇÃO
        // ================================================

        // Carrega dados salvos
        carregarComunidades();
        carregarSugeridas();

        // Renderiza na página
        renderizarComunidades();
        renderizarSugeridas();

        console.log('✅ Sistema de comunidades carregado com sucesso!');
        console.log(`✅ ${comunidades.length} comunidades carregadas`);
        console.log(`✅ ${comunidadesSugeridas.length} comunidades sugeridas carregadas`);

    </script>

</body>
</html>
