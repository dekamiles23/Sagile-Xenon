<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Comunidades - 100% Funcional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0012;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
        }

        /* ================================================
           MODAL DE CRIAR COMUNIDADE - ESTRUTURA COMPLETA
           ================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-create-community {
            width: 100%;
            max-width: 650px;
            background: #12121a;
            border: 2px solid #ff00ff;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.4);
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-create-community {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 0, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #00ffff;
        }

        .modal-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 0, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            background: rgba(255, 0, 255, 0.3);
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .form-textarea {
            resize: none;
            min-height: 80px;
        }

        .modal-footer {
            padding: 16px 24px 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255, 0, 255, 0.3);
            color: #fff;
        }

        .btn-ghost:hover {
            background: rgba(255, 0, 255, 0.1);
        }

        .btn-neon {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #000;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 0, 255, 0.3);
        }

        /* ================================================
           SEÇÃO MINHAS COMUNIDADES
           ================================================ */
        .section-title {
            color: #00ffff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .communities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .community-card {
            min-height: 280px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 0, 255, 0.3);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .community-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 0, 255, 0.6);
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.2);
        }

        .community-card.create-card {
            border: 2px dashed rgba(0, 255, 255, 0.4);
            background: rgba(0, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .community-card.create-card .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .community-card.create-card .title {
            color: #00ffff;
            font-size: 16px;
            font-weight: 600;
        }

        .community-card.create-card .subtitle {
            color: #888;
            font-size: 13px;
        }

        .community-card .banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .community-card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 20px 16px 16px 16px;
        }

        .community-card .name {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .community-card .members {
            color: #aaa;
            font-size: 12px;
        }

        .community-card .actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .community-card:hover .actions {
            opacity: 1;
        }

        .community-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .community-action-btn:hover {
            background: rgba(255, 0, 255, 0.4);
        }

        /* ================================================
           MENU DE CONTEXTO
           ================================================ */
        .context-menu {
            position: fixed;
            background: #12121a;
            border: 1px solid #ff00ff;
            border-radius: 8px;
            padding: 8px;
            min-width: 200px;
            z-index: 999999;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.3);
        }

        .context-menu-item {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-menu-item:hover {
            background: rgba(255, 0, 255, 0.15);
        }

        .context-menu-divider {
            height: 1px;
            background: rgba(255, 0, 255, 0.2);
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏠 MINHAS COMUNIDADES</h1>

        <div class="section-title">
            <span>✨</span> COMUNIDADES SUGERIDAS
        </div>
        <div id="suggested-communities-container" class="communities-grid">
            <div class="community-card create-card" id="suggested-empty-state">
                <div class="icon">🌐</div>
                <div class="title">Nenhuma comunidade ainda</div>
                <div class="subtitle">Clique com o botão direito em uma comunidade</div>
            </div>
        </div>

        <div class="section-title">
            <span>🏠</span> MINHAS COMUNIDADES
        </div>
        <div id="my-communities-grid" class="communities-grid">
            <div class="community-card create-card" id="btn-create-community-card">
                <div class="icon">+</div>
                <div class="title">Criar Comunidade</div>
                <div class="subtitle">Crie sua própria comunidade</div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CRIAR COMUNIDADE -->
    <div id="create-community-modal" class="modal-overlay">
        <div class="modal-create-community">
            <div class="modal-header">
                <div class="modal-title">🌐 CRIAR COMUNIDADE</div>
                <button class="modal-close-btn" id="modal-close-btn">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nome da Comunidade</label>
                    <input type="text" id="community-name" class="form-input" placeholder="Digite o nome da comunidade..." maxlength="32" />
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <textarea id="community-description" class="form-input form-textarea" placeholder="Descreva sua comunidade..." maxlength="200"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="btn-cancel-community">Cancelar</button>
                <button class="btn btn-neon" id="btn-create-community-confirm">✅ Criar Comunidade</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // SISTEMA COMPLETO DE COMUNIDADES - 100% FUNCIONAL
        // ================================================

        // Estado global
        let comunidades = [];
        let comunidadesSugeridas = [];

        // Elementos DOM
        const modal = document.getElementById('create-community-modal');
        const btnAbrirModal = document.getElementById('btn-create-community-card');
        const btnFecharModal = document.getElementById('modal-close-btn');
        const btnCancelar = document.getElementById('btn-cancel-community');
        const btnCriar = document.getElementById('btn-create-community-confirm');
        const gridComunidades = document.getElementById('my-communities-grid');
        const gridSugeridas = document.getElementById('suggested-communities-container');

        // ================================================
        // FUNÇÕES DO MODAL
        // ================================================

        function abrirModal() {
            modal.classList.add('active');
            document.getElementById('community-name').focus();
            console.log('✅ Modal aberto com sucesso!');
        }

        function fecharModal() {
            modal.classList.remove('active');
            // Limpa os campos
            document.getElementById('community-name').value = '';
            document.getElementById('community-description').value = '';
        }

        // Eventos do modal
        btnAbrirModal.addEventListener('click', abrirModal);
        btnFecharModal.addEventListener('click', fecharModal);
        btnCancelar.addEventListener('click', fecharModal);

        // Fecha modal ao clicar fora
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                fecharModal();
            }
        });

        // Fecha modal com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                fecharModal();
            }
        });

        // ================================================
        // CRIAR NOVA COMUNIDADE
        // ================================================

        btnCriar.addEventListener('click', () => {
            const nome = document.getElementById('community-name').value.trim();
            const descricao = document.getElementById('community-description').value.trim();

            if (!nome) {
                alert('Digite um nome para a comunidade');
                return;
            }

            // Cria o objeto da comunidade
            const novaComunidade = {
                id: 'comm_' + Date.now(),
                name: nome,
                description: descricao,
                members: 1,
                createdAt: Date.now()
            };

            // Adiciona no array
            comunidades.push(novaComunidade);

            // Salva no localStorage
            salvarComunidades();

            // Fecha o modal
            fecharModal();

            // Renderiza a nova comunidade na página
            renderizarComunidades();

            alert(`✅ Comunidade "${nome}" criada com sucesso!`);
        });

        // ================================================
        // RENDERIZAR COMUNIDADES NA PÁGINA
