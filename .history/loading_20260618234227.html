<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mega ZX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      user-select: none;
    }
    .logo { font-size: 2.5rem; font-weight: 800; letter-spacing: 4px; margin-bottom: 32px; text-transform: uppercase; }
    .logo span { color: #7c3aed; }
    .bar-wrapper { width: 220px; height: 4px; background: #222; border-radius: 4px; overflow: hidden; }
    .bar { height: 100%; width: 40%; background: #7c3aed; border-radius: 4px; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(650%); } }
    .msg { margin-top: 20px; font-size: 0.8rem; color: #444; letter-spacing: 1px; }
    .error-box { display: none; margin-top: 24px; background: #1a0a0a; border: 1px solid #5a1a1a; border-radius: 8px; padding: 16px 20px; max-width: 480px; text-align: center; }
    .error-box h3 { color: #f44444; font-size: 0.95rem; margin-bottom: 8px; }
    .error-box p { color: #888; font-size: 0.75rem; line-height: 1.5; }
    .log-path { margin-top: 8px; font-size: 0.7rem; color: #555; word-break: break-all; }
    .btn-log { margin-top: 12px; background: #2a1a1a; border: 1px solid #5a1a1a; color: #f44444; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-log:hover { background: #3a1a1a; }
    .btn-retry { margin-top: 8px; margin-left: 8px; background: #1a1a2a; border: 1px solid #3a3a7a; color: #7c3aed; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-retry:hover { background: #2a2a4a; }
  </style>
</head>
<body>
  <div class="logo">Mega <span>ZX</span></div>
  <div class="bar-wrapper"><div class="bar" id="bar"></div></div>
  <div class="msg" id="msg">Iniciando servidor...</div>

  <div class="error-box" id="errorBox">
    <h3>Servidor nao respondeu</h3>
    <p>O servidor interno nao conseguiu iniciar.<br>Verifique o arquivo de log para ver o erro.</p>
    <div class="log-path" id="logPath"></div>
    <div>
      <button class="btn-log" id="btnLog" onclick="abrirLog()">Ver Log de Erro</button>
      <button class="btn-retry" onclick="reiniciar()">Tentar Novamente</button>
    </div>
  </div>

  <script>
    // URL do servidor: se carregado pelo Electron (file://) usa localhost;
    // se aberto no browser usa a origem atual (compatível com deploy)
var SERVER = window.location.origin;

    // Pega o caminho do log via IPC (se disponivel)
    if (window.electronAPI && window.electronAPI.getLogPath) {
      window.electronAPI.getLogPath().then(function(p) {
        logPathEl.textContent = 'Log: ' + p;
      });
    }

    function ping() {
      attempts++;
      fetch(SERVER + '/auth.html', { method: 'HEAD', cache: 'no-store' })
        .then(function(res) {
          if (res.ok || res.status < 500) {
            msg.textContent = 'Conectado! Carregando...';
            // Em contexto de browser usa caminho relativo; no Electron usa URL absoluta
            if (window.location.protocol === 'file:') {
              window.location.href = SERVER + '/auth.html';
            } else {
              window.location.href = '/auth.html';
            }
          } else {
            retry();
          }
        })
        .catch(function() { retry(); });
    }

    function retry() {
      if (attempts < 80) {
        msg.textContent = 'Iniciando servidor... (' + attempts + ')';
        setTimeout(ping, 400);
      } else {
        bar.style.animation = 'none';
        bar.style.background = '#f44444';
        msg.style.color = '#f44444';
        msg.textContent = 'Servidor nao respondeu.';
        errorBox.style.display = 'block';
      }
    }

    function abrirLog() {
      if (window.electronAPI && window.electronAPI.openLog) {
        window.electronAPI.openLog();
      } else {
        alert('API de log nao disponivel. Procure o arquivo server.log na pasta AppData\\Roaming\\Mega ZX');
      }
    }

    function reiniciar() {
      attempts = 0;
      bar.style.animation = '';
      bar.style.background = '#7c3aed';
      msg.style.color = '#444';
      errorBox.style.display = 'none';
      setTimeout(ping, 600);
    }

    setTimeout(ping, 600);
  </script>
</body>
</html>
